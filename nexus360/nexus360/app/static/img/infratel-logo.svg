<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" role="img" aria-label="Infratel logo">
  <!-- Dark navy "C" arc body -->
  <path d="M38,10 A28,28 0 1,0 38,70" fill="none" stroke="#1a2b5e" stroke-width="9" stroke-linecap="round"/>
  <!-- Inner circle / dish -->
  <circle cx="40" cy="40" r="6" fill="#1a2b5e"/>
  <!-- Signal arc 1 (small, red) -->
  <path d="M46,33 A10,10 0 0,1 46,47" fill="none" stroke="#e8192c" stroke-width="3" stroke-linecap="round"/>
  <!-- Signal arc 2 (medium, red) -->
  <path d="M51,27 A18,18 0 0,1 51,53" fill="none" stroke="#e8192c" stroke-width="3" stroke-linecap="round"/>
  <!-- Signal arc 3 (large, red) -->
  <path d="M57,21 A26,26 0 0,1 57,59" fill="none" stroke="#e8192c" stroke-width="3" stroke-linecap="round"/>
  <!-- Wordmark: Infratel -->
  <text x="72" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1a2b5e" letter-spacing="-0.5">Infratel</text>
  <!-- Tagline -->
  <text x="73" y="57" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#555" letter-spacing="0.3">Accessible. Everywhere.</text>
</svg>
