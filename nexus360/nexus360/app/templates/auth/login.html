{% extends "base_public.html" %}
{% block content %}
<div class="login-wrap">

  <!-- Infratel logo above the card -->
  <img
    src="{{ url_for('static', filename='img/infratel-logo.svg') }}"
    alt="Infratel"
    class="login-logo"
  >

  <form class="card login" method="post">
    <h2>Sign in to Nexus 360</h2>
    <p style="margin:0 0 8px; font-size:.85rem; color:var(--text-muted);">
      Infratel's unified sales &amp; customer platform
    </p>

    {% for m in get_flashed_messages() %}
      <p class="error">{{ m }}</p>
    {% endfor %}

    <input name="email"    type="email"    placeholder="Email address" required>
    <input name="password" type="password" placeholder="Password"      required>
    <button class="btn" type="submit" style="width:100%; padding:12px;">Sign in</button>
  </form>

</div>
{% endblock %}
