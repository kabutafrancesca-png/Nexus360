{% extends "base.html" %}
{% block content %}
<h1>Change Password</h1>

<div class="card" style="max-width:420px;">
  {% with messages = get_flashed_messages() %}
    {% if messages %}{% for m in messages %}<p class="error">⚠ {{ m }}</p>{% endfor %}{% endif %}
  {% endwith %}

  <form method="post" style="display:flex; flex-direction:column; gap:12px;">
    <label>
      <span style="font-size:.85rem; color:var(--text-muted);">Current password</span>
      <input type="password" name="current_password" required style="width:100%; margin-top:4px;">
    </label>
    <label>
      <span style="font-size:.85rem; color:var(--text-muted);">New password (min 8 characters)</span>
      <input type="password" name="new_password" required minlength="8" style="width:100%; margin-top:4px;">
    </label>
    <label>
      <span style="font-size:.85rem; color:var(--text-muted);">Confirm new password</span>
      <input type="password" name="confirm_password" required style="width:100%; margin-top:4px;">
    </label>
    <div style="display:flex; gap:10px; margin-top:4px;">
      <button class="btn" type="submit">Update password</button>
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
